[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "db-backup"
version = "1.0.0"
description = "A CLI utility for backing up and restoring databases (MySQL, PostgreSQL, MongoDB)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "meet1785"}]

dependencies = [
    "click>=8.1",
    "boto3>=1.28",
    "requests>=2.31",
    "pymysql>=1.1",
    "psycopg2-binary>=2.9",
    "pymongo>=4.6",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
db-backup = "db_backup.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["db_backup*"]
